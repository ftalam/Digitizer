services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo-digitizer}
      POSTGRES_USER: ${POSTGRES_USER:-ftj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ftj}
    ports:
       ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ftj} -d ${POSTGRES_DB:-geo-digitizer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ftj}:${POSTGRES_PASSWORD:-ftj}@db:5432/${POSTGRES_DB:-geo-digitizer}
    ports: ["8000:8000"]
    volumes:
      - ./api/app:/code/app      # live reload
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
